apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: retainiq

resources:
  - namespace.yaml
  - config.yaml
  - identity-service.yaml
  - activity-ingestion.yaml
  - event-processor.yaml
  - analytics-service.yaml
  - notifications-service.yaml
  - monitoring.yaml

# Override image tags per environment, e.g.:
#   kustomize edit set image retainiq/identity-service=ghcr.io/your-org/identity-service:<sha>
images:
  - { name: retainiq/identity-service, newTag: latest }
  - { name: retainiq/activity-ingestion, newTag: latest }
  - { name: retainiq/event-processor, newTag: latest }
  - { name: retainiq/analytics-service, newTag: latest }
  - { name: retainiq/notifications-service, newTag: latest }
