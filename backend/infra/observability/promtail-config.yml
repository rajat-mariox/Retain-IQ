# Ships container stdout (the services' pino JSON logs) to Loki for local dev.
server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(retainiq-.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(retainiq-.*)"
        target_label: job
