# Prometheus Operator ServiceMonitors. Requires kube-prometheus-stack.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: identity-service
  namespace: retainiq
  labels: { release: kube-prometheus-stack }
spec:
  selector:
    matchLabels: { app: identity-service }
  endpoints:
    - { port: http, path: /v1/metrics, interval: 15s }
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: activity-ingestion
  namespace: retainiq
  labels: { release: kube-prometheus-stack }
spec:
  selector:
    matchLabels: { app: activity-ingestion }
  endpoints:
    - { port: http, path: /v1/metrics, interval: 15s }
---
apiVersion: monitoring.coreos.com/v1
