  namespace: retainiq
  labels: { release: kube-prometheus-stack }
spec:
  selector:
    matchLabels: { app: event-processor }
  endpoints:
    - { port: ops, path: /metrics, interval: 15s }
---
apiVersion: monitoring.coreos.com/v1
