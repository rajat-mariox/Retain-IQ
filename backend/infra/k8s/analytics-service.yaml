apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: retainiq
  labels: { app: analytics-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: analytics-service }
  template:
    metadata:
      labels: { app: analytics-service }
    spec:
      # Allow in-flight messages to finish; the worker drains on SIGTERM.
      terminationGracePeriodSeconds: 40
      containers:
        - name: analytics-service
          image: retainiq/analytics-service:latest
          command: ["node", "apps/analytics-service/dist/main.js"]
          ports:
            - { name: ops, containerPort: 3004 }
          envFrom:
            - configMapRef: { name: retainiq-config }
            - secretRef: { name: retainiq-secrets }
          env:
            - { name: HEALTH_PORT, value: "3004" }
            # Owns the analytics database (own inbox + employee day-facts).
            - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: retainiq-db, key: ANALYTICS_DATABASE_URL } } }
            # Unique consumer name per pod for the consumer group.
            - { name: CONSUMER_NAME, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
          resources:
            requests: { cpu: "300m", memory: "384Mi" }
            limits: { cpu: "2", memory: "768Mi" }
          livenessProbe:
            httpGet: { path: /health/live, port: ops }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health/ready, port: ops }
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-service
  namespace: retainiq
  labels: { app: analytics-service }
spec:
  clusterIP: None
  selector: { app: analytics-service }
  ports:
    - { name: ops, port: 3004, targetPort: ops }
---
# Scale on the activity stream backlog (consumer-group lag), not CPU.
# Requires KEDA installed in the cluster.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: analytics-service
  namespace: retainiq
spec:
  scaleTargetRef:
    name: analytics-service
  minReplicaCount: 1
  maxReplicaCount: 20
  cooldownPeriod: 120
  triggers:
    - type: redis-streams
      metadata:
        addressFromEnv: REDIS_URL
        stream: "retainiq.activity"
        consumerGroup: "analytics-service"
        pendingEntriesCount: "100"
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: analytics-service
  namespace: retainiq
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: analytics-service }
